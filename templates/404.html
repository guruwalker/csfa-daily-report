{% extends "base.html" %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="card" style="text-align: center; padding: 4rem 2rem;">
    <div style="font-size: 6rem; margin-bottom: 1rem;">🔍</div>
    <h1 style="font-size: 3rem; font-weight: 700; margin-bottom: 1rem;">404</h1>
    <p style="font-size: 1.5rem; color: var(--text-muted); margin-bottom: 2rem;">Page Not Found</p>
    <p style="margin-bottom: 2rem;">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">
        🏠 Go Home
    </a>
</div>
{% endblock %}
